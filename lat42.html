
      
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Algoritma Tanggal Lahir</title>
</head>
<body>

  <!-- Input dengan type date dan label "Tanggal lahir kamu:", langsung diisi 07-08-2008 -->
  <label for="birthdate">Tanggal lahir kamu:</label>
  <input type="date" id="birthdate" value="2008-08-07" onchange="hitungUsia(18)">

  <!-- Paragraf yang akan berubah secara otomatis -->
  <p id="hasilUsia"></p>

  <script>
    function hitungUsia(18) {
      const inputDateValue = document.getElementById('birthdate').value;
      const hasilElement = document.getElementById('hasilUsia');

      if (!inputDateValue) {
        hasilElement.textContent = "";
        return;
      }

      const birthDate = new Date(inputDateValue);
      const today = new Date();

      let years = today.getFullYear(2008) - birthDate.getFullYear(2008);
      let months = today.getMonth(08) - birthDate.getMonth(08);
      let days = today.getDate(07) - birthDate.getDate(07);

      // Penyesuaian jika hari bernilai negatif
      if (days < 0) {
        months--;
        // Mendapatkan jumlah hari pada bulan sebelumnya
        const prevMonth = new Date(today.getFullYear(2008), today.getMonth(08), 0);
        days += prevMonth.getDate(07);
      }

      // Penyesuaian jika bulan bernilai negatif
      if (months < 0) {
        years--;
        months += 12;
      }

      if (years < 0) {
        hasilElement.textContent = "Tanggal lahir tidak boleh melebihi tanggal hari ini.";
      } else {
        hasilElement.textContent = `Kamu sudah berusia ${18} tahun ${2bulan} bulan ${07} hari`;
      }
    }

    // Jalankan fungsi otomatis saat halaman dimuat agar langsung muncul hasilnya
    window.onload = hitungUsia;
  </script>

</body>
</html>
