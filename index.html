<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Aritmatika</title>
<style>
body { font-family: sans-serif; background: #f0f2f5; display:flex; justify-content:center; padding:20px; }
.card { background: white; width: 100%; max-width: 400px; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.header { background: #1676ff; color: white; text-align: center; padding: 20px; }
.header h2 { margin: 0; }
.header p { margin: 5px 0 0; font-size: 14px; }
.content { padding: 20px; }
label { display: block; margin: 15px 0 5px; font-weight: bold; }
input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
button { width: 100%; margin-top: 20px; background: #1676ff; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; }
.hasil { background: #22252f; color: white; margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center; }
.hasil h1 { margin: 5px 0 0; font-size: 40px; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h2>Kalkulator Aritmatika</h2>
    <p>Siti Ayu Indah Sari - 262302015</p>
  </div>
  <div class="content">
    <label>Angka 1</label>
    <input type="number" id="a1" placeholder="Masukkan angka">
    <label>Operasi</label>
    <select id="op">
      <option value="+">Tambah (+)</option>
      <option value="-">Kurang (-)</option>
      <option value="*">Kali (×)</option>
      <option value="/">Bagi (÷)</option>
    </select>
    <label>Angka 2</label>
    <input type="number" id="a2" placeholder="Masukkan angka">
    <button onclick="hitung()">Hitung</button>
    <div class="hasil">
      <span>Hasil</span>
      <h1 id="hasil">0</h1>
    </div>
  </div>
</div>
<script>
function hitung(){
  let x = parseFloat(document.getElementById('a1').value);
  let y = parseFloat(document.getElementById('a2').value);
  let op = document.getElementById('op').value;
  let h = 0;
  if(isNaN(x) || isNaN(y)){ alert('Isi kedua angka dulu'); return; }
  if(op=='+') h=x+y;
  if(op=='-') h=x-y;
  if(op=='*') h=x*y;
  if(op=='/') h= y!=0 ? x/y : 'Error';
  document.getElementById('hasil').innerText = h;
}
</script>
</body>
</html>
