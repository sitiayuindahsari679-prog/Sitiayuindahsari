<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Siti Ayu Indah Sari</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!-- Card Biodata -->
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h2 class="mb-0">BIODATA DIRI</h2>
                    </div>

                    <div class="card-body p-4">

                        <!-- Foto -->
                        <div class="text-center mb-4">
                            <div class="bg-secondary text-white rounded-circle 
                                        d-flex align-items-center justify-content-center mx-auto"
                                 style="width: 120px; height: 120px;">
                                <span>Foto</span>
                            </div>
                        </div>

                        <!-- Data Diri -->
                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <tr>
                                    <th class="table-primary">Nama</th>
                                    <td>Siti Ayu Indah Sari</td>
                                </tr>
                                <tr>
                                    <th class="table-primary">Kelas</th>
                                    <td>Komputerisasi Akuntansi</td>
                                </tr>
                                <tr>
                                    <th class="table-primary">Semester</th>
                                    <td>1</td>
                                </tr>
                            </table>
                        </div>

                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">
                                Mahasiswa Semester 1
                            </p>
                        </div>

                    </div>

                    <div class="card-footer text-center text-muted">
                        &copy; 2026 Siti Ayu Indah Sari
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
